name: Set up node and install
description: Node 22, yarn 1, a warm cache, and the project's dependencies.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22

    - shell: bash
      run: npm install --global yarn@1.22.22

    - id: caches
      shell: bash
      run: |
        echo "yarn=$(yarn cache dir)" >> "$GITHUB_OUTPUT"
        if [ "$RUNNER_OS" = macOS ]; then
          echo "electron=$HOME/Library/Caches/electron" >> "$GITHUB_OUTPUT"
        else
          echo "electron=$HOME/.cache/electron" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/cache@v4
      with:
        path: |
          ${{ steps.caches.outputs.yarn }}
          ${{ steps.caches.outputs.electron }}
        key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
        restore-keys: yarn-${{ runner.os }}-

    - shell: bash
      run: yarn install --frozen-lockfile
